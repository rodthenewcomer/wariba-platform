name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: neither job needs anything beyond reading repo
# contents (no PR comments, no releases, no pushes). Without this, the
# GITHUB_TOKEN inherits the repo/org default permissions, which may be
# broader than this workflow needs — a supply-chain compromise of any
# action used below would then have more ambient access than it should.
permissions:
  contents: read

jobs:
  ci:
    name: Static, unit and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Import boundaries
        run: pnpm boundaries:check

      - name: Secret scan
        run: pnpm secrets:scan

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  database-and-e2e:
    name: Database, RLS and E2E
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Start and migrate isolated Supabase
        run: |
          supabase start
          supabase db reset
          supabase status -o env > /tmp/wariba-supabase.env
          set -a
          source /tmp/wariba-supabase.env
          {
            echo "APP_ENV=local"
            echo "APP_BASE_URL=http://127.0.0.1:3000"
            echo "DATABASE_URL=$DB_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_REALTIME_WS_URL=ws://127.0.0.1:4001/ws"
            echo "MARKET_DATA_PROVIDER=mock"
            echo "PAYMENT_PROVIDER=sandbox"
            echo "SANDBOX_WEBHOOK_SECRET=ci-local-only"
          } >> "$GITHUB_ENV"

      - name: Database assertions
        run: pnpm db:test

      - name: Integration tests
        run: pnpm test:integration

      - name: RLS tests
        run: pnpm test:rls

      - name: Install Playwright Chromium
        run: pnpm --filter @wariba/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
