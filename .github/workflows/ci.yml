name: PR Fast Gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: timing
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-node
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm boundaries:check
      - run: pnpm secrets:scan
      - if: always()
        uses: ./.github/actions/record-ci-metric
        with:
          metric-id: static
          label: STATIC
          started-at: ${{ steps.timing.outputs.epoch }}
          status: ${{ job.status }}

  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: timing
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-node
      - run: pnpm test:unit
      - if: always()
        uses: ./.github/actions/record-ci-metric
        with:
          metric-id: unit
          label: UNIT
          started-at: ${{ steps.timing.outputs.epoch }}
          status: ${{ job.status }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: timing
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-node
      - run: pnpm build
      - if: always()
        uses: ./.github/actions/record-ci-metric
        with:
          metric-id: build
          label: BUILD
          started-at: ${{ steps.timing.outputs.epoch }}
          status: ${{ job.status }}

  database-integration:
    name: DB Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: timing
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-supabase
      - run: pnpm db:test
      - run: pnpm test:integration:smoke
      - if: always()
        run: supabase stop --no-backup
      - if: always()
        uses: ./.github/actions/record-ci-metric
        with:
          metric-id: db-integration
          label: DB INTEGRATION
          started-at: ${{ steps.timing.outputs.epoch }}
          status: ${{ job.status }}

  rls-smoke:
    name: RLS Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: timing
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-supabase
      - run: pnpm test:rls:smoke
      - if: always()
        run: supabase stop --no-backup
      - if: always()
        uses: ./.github/actions/record-ci-metric
        with:
          metric-id: rls-smoke
          label: RLS SMOKE
          started-at: ${{ steps.timing.outputs.epoch }}
          status: ${{ job.status }}

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: timing
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-supabase
      - run: pnpm --filter @wariba/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e:smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-failure-${{ github.run_attempt }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        run: supabase stop --no-backup
      - if: always()
        uses: ./.github/actions/record-ci-metric
        with:
          metric-id: e2e-smoke
          label: E2E SMOKE
          started-at: ${{ steps.timing.outputs.epoch }}
          status: ${{ job.status }}

  summary:
    name: Fast Gate Summary
    if: always()
    needs: [static, unit, build, database-integration, rls-smoke, e2e-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-metric-*
          path: ci-metrics
          merge-multiple: true
      - name: Write summary
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const rows = fs.readdirSync('ci-metrics').sort().map((file) => {
            const [label, status, duration, started, ended] = fs.readFileSync(`ci-metrics/${file}`, 'utf8').trim().split('|');
            return { label, status: status.toUpperCase(), duration: Number(duration), started: Number(started), ended: Number(ended) };
          });
          const format = (seconds) => `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
          const total = Math.max(...rows.map((row) => row.ended)) - Math.min(...rows.map((row) => row.started));
          const lines = ['## PR Fast Gate', '', '| Suite | Status | Duration |', '|---|---:|---:|'];
          for (const row of rows) lines.push(`| ${row.label} | ${row.status} | ${format(row.duration)} |`);
          lines.push('', `**Total wall clock:** ${format(total)}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          if (rows.some((row) => row.status !== 'SUCCESS')) process.exitCode = 1;
          NODE
